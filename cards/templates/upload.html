<!doctype html>
<html>
  <head>
    <title>Upload Image</title>
  </head>
  <body>
    <h2>Upload Image</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <input
        type="text"
        name="title"
        placeholder="Enter Title"
        required
      /><br /><br />
      <input type="text" name="des" placeholder='Enter Description' required><br /><br />

      <input type="file" name="image" required /><br /><br />

      <button type="submit">Upload</button>
    </form>
  </body>
</html>
