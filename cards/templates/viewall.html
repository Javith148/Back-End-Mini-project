{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-700 min-h-screen">


<nav class="bg-red-800 shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-white">MyWallpapers</h1>
        <a href="{% url 'show' %}" 
           class="bg-white text-red-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-200 transition">
            Back
        </a>
    </div>
</nav>

<div class="container mx-auto p-10">

    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-4xl mx-auto">

        {% if post.image %}
        <img src="{{ post.image.url }}" 
             class="w-full h-96 object-cover">
        {% endif %}

        <div class="p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">
                {{ post.title }}
            </h1>

            <p class="text-gray-600 text-lg leading-relaxed">
                {{ post.des }}
            </p>
        </div>

    </div>

</div>

</body>
</html>
